/* ===== build 9 tweaks ===== */
button{white-space:nowrap}
/* home: sleeping cat girl photo + light rays */
#s_menu{background:url(assets/story/story_01.webp) center/cover no-repeat;border:0;box-shadow:none;overflow:hidden;justify-content:space-between;padding:.8em 1em 1em}
#s_menu>*{position:relative;z-index:2}
#s_menu::before{content:"";position:absolute;inset:-15%;z-index:1;pointer-events:none;mix-blend-mode:screen;background:repeating-linear-gradient(112deg,#0000 0 7%,#fff2c022 8%,#fff2c06a 11%,#fff2c022 14%,#0000 15% 24%);filter:blur(.5em);-webkit-mask-image:linear-gradient(135deg,#000 0%,#000a 35%,#0000 72%);mask-image:linear-gradient(135deg,#000 0%,#000a 35%,#0000 72%);transform-origin:0 0;animation:rays 10s ease-in-out infinite alternate}
