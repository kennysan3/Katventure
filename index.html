button{white-space:nowrap}
/* home: sleeping cat girl photo + light rays */

function use(k){if(busy)return;busy=true;const i=ITM[k];S.inv[k]--;let m;if(i[2]){S.hp=Math.min(S.mhp,S.hp+i[2]);m='You hand the cat girl a '+i[0]+'. +'+i[2]+' HP.'}else{S.mp=Math.min(S.mmp,S.mp+i[3]);m='You hand the cat girl an '+i[0]+'. +'+i[3]+' MP.'}bars();pop('+'+(i[2]||i[3]),'cb_cat','heal');cat.play('eat',()=>cat.play('idle'));say([m],eTurn)}
function useT(k){if(busy)return;busy=true;S.tl[k]--;const d=TL[k][2],c=$('cb_cov');cw=1;c.style.display='flex';c.textContent='The cat girl throws a '+TL[k][0]+'!';cat.play('throw',()=>cat.play('idle'));setTimeout(()=>{E.hp-=d;pop(d,'cb_en');bars();cw=0;say(['The '+TL[k][0]+' hits '+E.n+' for '+d+' damage.'],()=>E.hp<=0?won():eTurn())},650)}
function flee(){if(busy)return;busy=true;if(E.boss)return say(['The cat girl refuses to run from a boss!'],eTurn);if(Math.random()<.6)say(['You tell the cat girl to retreat, and you get away!'],()=>explore());else say(['Could not escape!'],eTurn)}
function eTurn(){const d=Math.max(1,Math.round(E.atk*(.85+Math.random()*.3)));S.hp-=d;pop(d,'cb_cat','hurt');bars();
 if(S.hp<=0){S.hp=0;bars();cat.play('cry');return say([`${E.n} hits the cat girl for ${d}.`,'The cat girl collapses...'],()=>{S.hp=S.mhp;ending(E.bad)})}
 say([`${E.n} hits the cat girl for ${d}.`],()=>{busy=false;cm('main')})}
function won(){const ar=X.ar,xp=(5+ar*3)*(E.boss?5:1),g=4+ar*3+Math.floor(Math.random()*5)+(E.boss?40:0);S.xp+=xp;S.gold+=g;const L2=['Victory! '+E.n+' is defeated.',`Reward: ${xp} XP and ${g} gold.`];
 while(S.xp>=S.lvl*18){S.xp-=S.lvl*18;S.lvl++;S.mhp+=8;S.mmp+=3;S.hp=S.mhp;S.mp=S.mmp;L2.push(`Level up! The cat girl reached Lv${S.lvl}. HP, MP and ATK rose.`)}
 if(E.boss||Math.random()<.65){const pn=E.drop;S.parts[pn]=(S.parts[pn]||0)+1;L2.push('Dropped: '+pn+'.')}cat.play('win');say(L2,()=>{autosave();E.win?E.win():explore()})}

/* keep every button label on one row: shrink the font if a label does not fit */
(function(){let q=0;function fit(){q=0;document.querySelectorAll('button').forEach(b=>{if(b.dataset.fs){b.style.fontSize='';delete b.dataset.fs}});document.querySelectorAll('button').forEach(b=>{if(!b.offsetParent||b.classList.contains('pt'))return;let s=parseFloat(getComputedStyle(b).fontSize),n=0;while(b.scrollWidth>b.clientWidth+1&&s>7&&n++<30){s-=.5;b.style.fontSize=s+'px';b.dataset.fs=1}})}
const sched=()=>{if(!q)q=requestAnimationFrame(fit)};new MutationObserver(sched).observe(document.getElementById('app'),{childList:true,subtree:true,attributes:true,attributeFilter:['class','disabled']});addEventListener('resize',sched);sched()})();

/* fullscreen on touch devices: first tap in landscape enters fullscreen (browsers need a tap); corner button toggles it */
(function(){const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen;
if(!rq||!matchMedia('(pointer:coarse)').matches)return;
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const btn=document.createElement('button');btn.id='fsb';btn.title='Fullscreen';btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';document.body.appendChild(btn);document.body.classList.add('fsok');
function go(){if(isFs())return;let r;try{r=rq.call(el)}catch(e){}Promise.resolve(r).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}
btn.onclick=e=>{e.stopPropagation();isFs()?ex.call(document):go()};
const upd=()=>document.body.classList.toggle('fs',isFs());document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);
let auto=false;addEventListener('pointerup',()=>{if(!auto&&!isFs()&&matchMedia('(orientation:landscape)').matches){auto=true;go()}},true)})();
</script></body></html>
